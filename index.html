<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#FF8A3D" />
    <meta name="robots" content="index, follow" />
    <meta
      name="description"
      content="Two songs enter the ring and every vote from the room or your Twitch chat lands a punch until one is knocked out. Play free in the browser, on a call, or on stream."
    />
    <!-- Flattened onto white, because iOS composites a transparent icon onto
         black and the mark's dark outlines vanish into it. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!--
      scripts/prerender.mjs rewrites the canonical, title, description, og,
      twitter and JSON-LD below for each route it emits, so the shapes here
      have to stay predictable. Check that script before reformatting them.
    -->
    <link rel="canonical" href="https://tuneboxed.com/" />
    <meta property="og:site_name" content="TuneBoxed" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="TuneBoxed | Song battles fought as boxing matches" />
    <meta
      property="og:description"
      content="Two songs enter the ring and every vote from the room or your Twitch chat lands a punch until one is knocked out. Play free in the browser, on a call, or on stream."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tuneboxed.com/" />
    <meta property="og:image" content="https://tuneboxed.com/logo512.png" />
    <meta property="og:image:alt" content="TuneBoxed" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="TuneBoxed | Song battles fought as boxing matches" />
    <meta
      name="twitter:description"
      content="Two songs enter the ring and every vote from the room or your Twitch chat lands a punch until one is knocked out. Play free in the browser, on a call, or on stream."
    />
    <meta name="twitter:image" content="https://tuneboxed.com/logo512.png" />
    <meta name="twitter:image:alt" content="TuneBoxed" />

    <title>TuneBoxed | Song battles fought as boxing matches</title>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://tuneboxed.com/#organization",
            "name": "TuneBoxed",
            "url": "https://tuneboxed.com/",
            "logo": "https://tuneboxed.com/logo512.png"
          },
          {
            "@type": "WebSite",
            "@id": "https://tuneboxed.com/#website",
            "name": "TuneBoxed",
            "alternateName": ["Tune Boxed", "TuneBoxed Battle"],
            "url": "https://tuneboxed.com/",
            "publisher": { "@id": "https://tuneboxed.com/#organization" }
          }
        ]
      }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <!--
      Pairs with the redirect in public/404.html. GitHub Pages serves 404.html for
      any path it has no file for, which is every client-side route. That page
      encodes the path into a query string; this restores it before React Router
      reads the URL. Both halves must ship together or deep links break.
    -->
    <script>
      (function (location) {
        if (location.search[1] === '/') {
          var decoded = location.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(
            null,
            '',
            location.pathname.slice(0, -1) + decoded + location.hash
          );
        }
      })(window.location);
    </script>

    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>

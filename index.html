<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#FF8A3D" />
    <meta name="robots" content="index, follow" />
    <meta
      name="description"
      content="Play a free song battle online. Everyone picks a song, two square up in a boxing ring, and every vote or Twitch chat message lands a punch. No app, no account."
    />
    <!-- Flattened onto white, because iOS composites a transparent icon onto
         black and the mark's dark outlines vanish into it. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!--
      scripts/prerender.mjs rewrites the canonical, title, description, og,
      twitter and JSON-LD below for each route it emits, so the shapes here
      have to stay predictable. Check that script before reformatting them.
    -->
    <link rel="canonical" href="https://tuneboxed.com/" />
    <meta property="og:site_name" content="TuneBoxed" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="TuneBoxed | Song Battle Game, Free Online and on Twitch" />
    <meta
      property="og:description"
      content="Play a free song battle online. Everyone picks a song, two square up in a boxing ring, and every vote or Twitch chat message lands a punch. No app, no account."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tuneboxed.com/" />
    <meta property="og:image" content="https://tuneboxed.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="TuneBoxed: blue and orange music-note boxers square up. Song battles fought as boxing matches, every vote lands a punch."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TuneBoxed | Song Battle Game, Free Online and on Twitch" />
    <meta
      name="twitter:description"
      content="Play a free song battle online. Everyone picks a song, two square up in a boxing ring, and every vote or Twitch chat message lands a punch. No app, no account."
    />
    <meta name="twitter:image" content="https://tuneboxed.com/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="TuneBoxed: blue and orange music-note boxers square up. Song battles fought as boxing matches, every vote lands a punch."
    />

    <!-- The prerendered page text (scripts/staticBody.mjs) that the app
         replaces on boot. It fades in only if the app has not loaded by then,
         so normal visits do not flash unstyled text. -->
    <style>
      .prerender { max-width: 760px; margin: 0 auto; padding: 32px 20px; font: 16px/1.6 system-ui, sans-serif; color: #f4f4f5; background: #0d0d12; opacity: 0; animation: prerender-in 0.3s 1.5s forwards; }
      .prerender a { color: #ffa04d; }
      .prerender nav { margin-bottom: 24px; }
      @keyframes prerender-in { to { opacity: 1; } }
    </style>

    <title>TuneBoxed | Song Battle Game, Free Online and on Twitch</title>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://tuneboxed.com/#organization",
            "name": "TuneBoxed",
            "url": "https://tuneboxed.com/",
            "logo": "https://tuneboxed.com/logo512.png"
          },
          {
            "@type": "WebSite",
            "@id": "https://tuneboxed.com/#website",
            "name": "TuneBoxed",
            "alternateName": ["Tune Boxed", "TuneBoxed Battle"],
            "url": "https://tuneboxed.com/",
            "publisher": { "@id": "https://tuneboxed.com/#organization" }
          }
        ]
      }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <!--
      Pairs with the redirect in public/404.html. GitHub Pages serves 404.html for
      any path it has no file for, which is every client-side route. That page
      encodes the path into a query string; this restores it before React Router
      reads the URL. Both halves must ship together or deep links break.
    -->
    <script>
      (function (location) {
        if (location.search[1] === '/') {
          var decoded = location.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(
            null,
            '',
            location.pathname.slice(0, -1) + decoded + location.hash
          );
        }
      })(window.location);
    </script>

    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>

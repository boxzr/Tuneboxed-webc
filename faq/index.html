    <meta name="viewport" content="width=device-width, initial-scale=1" />

      content="Common questions about running a TuneBoxed song battle: Twitch chat voting, joining from a browser, the OBS overlay, and how long a bracket takes."
    />
    <!-- Flattened onto white, because iOS composites a transparent icon onto
         black and the mark's dark outlines vanish into it. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!--
      scripts/prerender.mjs rewrites the canonical, title, description and og
      tags below for each route it emits, so the shapes here have to stay
      predictable. Check that script before reformatting them.
    -->
    <link rel="canonical" href="https://tuneboxed.com/faq" />
    <meta property="og:site_name" content="TuneBoxed" />
    <meta property="og:title" content="FAQ | TuneBoxed" />
    <meta
      property="og:description"
      content="Common questions about running a TuneBoxed song battle: Twitch chat voting, joining from a browser, the OBS overlay, and how long a bracket takes."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tuneboxed.com/faq" />
    <meta property="og:image" content="https://tuneboxed.com/logo512.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <title>FAQ | TuneBoxed</title>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",

    <script type="module" crossorigin src="/assets/index-D6vkj5mG.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CFywHdCD.css">
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <!--
      Pairs with the redirect in public/404.html. GitHub Pages serves 404.html for
      any path it has no file for, which is every client-side route. That page
      encodes the path into a query string; this restores it before React Router
      reads the URL. Both halves must ship together or deep links break.
    -->
    <script>
      (function (location) {
        if (location.search[1] === '/') {
          var decoded = location.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(
            null,
            '',
            location.pathname.slice(0, -1) + decoded + location.hash
          );
        }
      })(window.location);
    </script>

  </body>
